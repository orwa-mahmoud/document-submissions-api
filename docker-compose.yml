services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env.docker
    # Do not publish 5432 — owner's localdev-services already uses it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_submissions"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    # Do not publish 6379 — owner's localdev-services already uses it.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s
  worker:
    build: .
    command: ["npx", "tsx", "src/composition/worker.ts"]
    env_file:
      - .env.docker
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
